polecenie: >
  Klient Agrando z Opola twierdzi, że ma u nas 60 dni na zapłatę faktur. Jaki termin płatności
  faktycznie obowiązuje AGRANDO S.A. i na jakiej podstawie? Czy w dokumentach są w tej sprawie rozbieżności?

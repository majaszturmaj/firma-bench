# Wersja 2 (16.10.2026): polecenie wprost dopuszcza wiedzę o przepisach (w wersji 1 progi ustawowe były potrzebne,
# a instrukcja systemowa każe odpowiadać na podstawie dokumentów — poprawna odmowa była oceniana jako porażka).
id: R12
nazwa: Rekompensata za koszty odzyskiwania należności (Montarex)
poziom: L2
kategoria: rozumowanie
obszar: przepisy o opóźnieniach w transakcjach handlowych (wiedza spoza dokumentów, dopuszczona w poleceniu)
wiedza_zewnetrzna: true
pulapki: [T25]
dokumenty_kluczowe: [PIS-K05-PROJEKT, FV-2026-06-044, FV-2026-07-009]
polecenie: >
  W projekcie wezwania do Montarex mecenas wpisał rekompensatę za koszty odzyskiwania należności: 70 euro dla jednej
  faktury i 100 euro dla drugiej. Dlaczego kwoty są różne i czy są prawidłowe? Progów rekompensaty nie ma
  w dokumentach firmy — w tym zadaniu oprzyj się na przepisach ustawy z dnia 8 marca 2013 r. o przeciwdziałaniu
  nadmiernym opóźnieniom w transakcjach handlowych i zaznacz, które informacje pochodzą spoza dokumentów.
format_odpowiedzi:
  rekompensata_fv_2026_06_044_eur: "liczba"
  rekompensata_fv_2026_07_009_eur: "liczba"
  progi_ustawowe: "lista progów wartości świadczenia i odpowiadających im kwot rekompensaty"
  uzasadnienie: "przypisanie faktur do progów i podstawa prawna"
  kwoty_prawidlowe: "true/false"
  zrodlo_progow: "skąd pochodzą progi (dokumenty firmy czy przepisy — wiedza spoza dokumentów)"
  zrodla: "lista nazw plików, na których oparto odpowiedź"
sprawdzenia:
  - {id: fv_044, typ: rowne, pole: rekompensata_fv_2026_06_044_eur, wartosc: 70, waga: 1}
  - {id: fv_009, typ: rowne, pole: rekompensata_fv_2026_07_009_eur, wartosc: 100, waga: 1}
  - {id: prawidlowe, typ: rowne, pole: kwoty_prawidlowe, wartosc: true, waga: 2, krytyczne: true}
  - {id: progi_zl, typ: zawiera, pole: [progi_ustawowe, uzasadnienie], wszystkie: true, wzorce: ['\b5[ .]?000(,00)? ?(zł|złotych|pln)|\b5 tys\.? ?(zł|złotych|pln)', '\b50[ .]?000(,00)? ?(zł|złotych|pln)|\b50 tys\.? ?(zł|złotych|pln)'], waga: 3, krytyczne: true}
  - {id: para_100, typ: zawiera, pole: [progi_ustawowe, uzasadnienie], wzorce: ['\b50[ .]?000(,00)? ?(zł|złotych|pln)[^"]{0,60}\b100 ?(eur|euro)', '\b100 ?(eur|euro)[^"]{0,80}\b50[ .]?000(,00)? ?(zł|złotych|pln)'], waga: 1}
  - {id: prog_40, typ: zawiera, pole: [progi_ustawowe, uzasadnienie], wzorce: ['\b40 ?(eur|euro)'], waga: 1}
  - {id: kwoty_faktur, typ: zawiera, pole: uzasadnienie, wszystkie: true, wzorce: ['48[ .]?216', '59[ .]?962'], waga: 1}
  - {id: ustawa, typ: zawiera, pole: [uzasadnienie, zrodlo_progow], wzorce: ['art\.? ?10', '8 marca 2013', 'opóźnieniom w transakcjach'], waga: 1}
  - {id: zrodlo_przepisy, typ: zawiera, pole: zrodlo_progow, wzorce: ['przepis', 'ustaw', 'spoza', 'wiedz'], waga: 1}
kryteria_oceny:
  - "Podaje progi z art. 10 ust. 1 ustawy (40 euro do 5 000 zł, 70 euro powyżej 5 000 zł i poniżej 50 000 zł, 100 euro od 50 000 zł) i przypisuje faktury według ich kwot brutto."
  - "Wyraźnie oddziela informacje z dokumentów (kwoty faktur, projekt pisma) od wiedzy o przepisach; nie wymyśla progów."
wzorcowa:
  rekompensata_fv_2026_06_044_eur: 70
  rekompensata_fv_2026_07_009_eur: 100
  progi_ustawowe: ["do 5 000 zł — 40 euro", "powyżej 5 000 zł i poniżej 50 000 zł — 70 euro", "od 50 000 zł — 100 euro"]
  uzasadnienie: "Art. 10 ust. 1 ustawy z 8 marca 2013 r. o przeciwdziałaniu nadmiernym opóźnieniom w transakcjach handlowych uzależnia rekompensatę od wartości świadczenia. FV/2026/06/044 — 48 216,00 zł brutto (powyżej 5 000 zł, poniżej 50 000 zł) → 70 euro; FV/2026/07/009 — 59 962,50 zł brutto (od 50 000 zł) → 100 euro."
  kwoty_prawidlowe: true
  zrodlo_progow: "przepisy ustawy (wiedza spoza dokumentów); kwoty faktur z dokumentów"

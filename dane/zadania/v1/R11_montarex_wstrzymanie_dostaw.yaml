polecenie: >
  Montarex przysłał dziś nowe zamówienie. Czy możemy wstrzymać jego realizację do czasu zapłaty zaległości?
  Ile wynoszą zaległości i ile dni opóźnienia ma każda faktura na dziś? Czy możemy jeszcze dziś wysłać
  klientowi informację o wstrzymaniu?

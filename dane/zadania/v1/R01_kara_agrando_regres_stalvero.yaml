id: R01
nazwa: Kara od AGRANDO i regres do Stalvero
poziom: L2
kategoria: rozumowanie
obszar: kary umowne, liczenie dni roboczych, łańcuch przyczyn
pulapki: []
dokumenty_kluczowe: [NOTA-K01-NO-2026-08, UMW-K01, ZAM-K01-014, UMW-D01, EML-D01-01, DOSTAWY-STALI-2026, NOT-ZARZAD-2026-08-31, PROC-PZ03-W2]
polecenie: >
  AGRANDO obciążyło nas notą NO/2026/08. Sprawdź, czy kwota kary zgadza się z umową, i ustal, czy oraz na jaką
  kwotę możemy obciążyć karą umowną Stalvero za opóźnioną dostawę blach, przez którą nie zdążyliśmy z partią
  dla AGRANDO. Czy już to zrobiliśmy i kto musi zaakceptować taką notę?
format_odpowiedzi:
  kara_agrando_zgodna_z_umowa: "true/false"
  kara_agrando_zl: "liczba"
  wyliczenie_agrando: "sposób wyliczenia"
  kara_stalvero_zl: "liczba — kwota, którą możemy naliczyć Stalvero"
  wyliczenie_stalvero: "sposób wyliczenia (stawka, podstawa, liczba dni)"
  kara_stalvero_juz_naliczona: "true/false"
  kto_akceptuje_note: "kto u nas akceptuje notę obciążeniową dla dostawcy"
  zrodla: "lista nazw plików, na których oparto odpowiedź"
sprawdzenia:
  - {id: agrando_zgodna, typ: rowne, pole: kara_agrando_zgodna_z_umowa, wartosc: true, waga: 2}
  - {id: agrando_kwota, typ: rowne, pole: kara_agrando_zl, wartosc: 4632, waga: 1}

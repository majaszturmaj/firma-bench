  - {id: marza_q3, typ: rowne, pole: marza_q3_zl, wartosc: 864360, waga: 2, krytyczne: true}
  - {id: spadek, typ: rowne, pole: spadek_marzy_zl, wartosc: 297080, dopuszczalne: [-297080], waga: 1}
  - {id: mat_q2, typ: zawiera, pole: udzial_materialow_q2_procent, wzorce: ['^\s*"?39([,.]0\d*)?\b', '\b39([,.]0\d*)?\s?%'], waga: 1}
  - {id: mat_q3, typ: zawiera, pole: udzial_materialow_q3_procent, wzorce: ['\b44[,.][45]\d*', '^\s*"?44\b', '\b44\s?%'], waga: 1}
  - {id: czynnik, typ: zawiera, pole: glowny_czynnik, wzorce: ['materiał', 'blach', 'stal'], waga: 1}
  - {id: zrodlo, typ: cytuje, dokumenty: [SPRZEDAZ-2026], waga: 1}

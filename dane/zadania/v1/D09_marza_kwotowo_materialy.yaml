id: D09
nazwa: Marża brutto w złotych i udział materiałów
poziom: L2
kategoria: analiza_danych
obszar: rachunek marży, wskaźniki procentowe
pulapki: []
dokumenty_kluczowe: [SPRZEDAZ-2026, KPI-Q3-2026, DOSTAWY-STALI-2026]
polecenie: >
  Podaj marżę brutto w złotych za II i III kwartał 2026 r. i o ile spadła. Jaki był udział kosztów materiałów
  w przychodach w obu kwartałach i co najbardziej obniżyło marżę?
format_odpowiedzi:
  marza_q2_zl: "liczba"
  marza_q3_zl: "liczba"
  spadek_marzy_zl: "liczba"
  udzial_materialow_q2_procent: "liczba"
  udzial_materialow_q3_procent: "liczba"
  glowny_czynnik: "tekst z uzasadnieniem liczbowym"
  zrodla: "lista nazw plików, na których oparto odpowiedź"
sprawdzenia:

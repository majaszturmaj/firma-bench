  przychody_najnizsze_zl: "liczba"
  miesiac_najwyzszy: "miesiąc"
  przychody_najwyzsze_zl: "liczba"
  spadek_q3_vs_q2_procent: "liczba"
  zrodla: "lista nazw plików, na których oparto odpowiedź"
sprawdzenia:

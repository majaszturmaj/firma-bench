  - {id: najnizszy_kwota, typ: rowne, pole: przychody_najnizsze_zl, wartosc: 1300000, waga: 2}
  - {id: najwyzszy, typ: zawiera, pole: miesiac_najwyzszy, wzorce: ['czerw', '\b0?6\b', '2026-06'], waga: 1}
  - {id: najwyzszy_kwota, typ: rowne, pole: przychody_najwyzsze_zl, wartosc: 1680000, waga: 1}
  - {id: spadek, typ: zawiera, pole: spadek_q3_vs_q2_procent, wzorce: ['\b9[,.]6'], waga: 2}
  - {id: zrodlo, typ: cytuje, dokumenty: [SPRZEDAZ-2026], waga: 1}
wzorcowa:
  miesiac_najnizszy: "sierpień 2026"
  przychody_najnizsze_zl: 1300000

id: D08
nazwa: Najsłabszy i najlepszy miesiąc sprzedaży 2026
poziom: L1
kategoria: analiza_danych
obszar: odczyt i porównanie danych z arkusza
pulapki: []
dokumenty_kluczowe: [SPRZEDAZ-2026]
polecenie: >
  W którym miesiącu 2026 r. przychody netto były najniższe, a w którym najwyższe (podaj kwoty)? O ile procent
  przychody III kwartału były niższe niż II kwartału?
format_odpowiedzi:

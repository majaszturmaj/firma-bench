  wyjasnienie: "Ewidencja nadgodzin podaje tylko sumy dla zmian I i II w kolejnych miesiącach, bez podziału na pracowników; przy 800 h w lipcu–sierpniu przekroczenie u części osób jest możliwe, ale nie da się go stwierdzić."
  zalecenie: "Sprawdzić imienną ewidencję czasu pracy (B. Grabowska) dla każdego pracownika produkcji."

kryteria_oceny:
  - "Stwierdza, że ewidencja zawiera tylko sumy na zmiany i miesiące, więc nie da się ustalić przekroczeń indywidualnych; nie zgaduje."
  - "Podaje limit 150 h/rok (regulamin § 9 ust. 2) i sumę 1 117 h, zauważa ryzyko po 800 h w lipcu–sierpniu i zaleca sprawdzenie ewidencji imiennej."
wzorcowa:

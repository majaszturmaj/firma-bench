id: W03
nazwa: Dane rejestrowe i reprezentacja przy umowie na 80 000 zł
poziom: L1
kategoria: wyszukiwanie
obszar: dane rejestrowe, zasady reprezentacji spółki
pulapki: [T18]
dokumenty_kluczowe: [KRS-ODPIS, UMOWA-SPOLKI, INSTR-OBIEG]
polecenie: >
  Przygotowuję umowę z nowym dostawcą na 80 000 zł netto. Podaj dane FIRMY do komparycji umowy (KRS, NIP,
  REGON, kapitał zakładowy) i napisz, kto musi podpisać umowę po naszej stronie.
format_odpowiedzi:
  krs: "numer KRS"
  nip: "NIP"
  regon: "REGON"
  kapital_zakladowy_zl: "liczba"
  kto_podpisuje: "kto i w jakim składzie podpisuje umowę"
  podstawa: "źródło zasady reprezentacji"
  zrodla: "lista nazw plików, na których oparto odpowiedź"
sprawdzenia:
  - {id: krs, typ: zawiera, pole: krs, wzorce: ['0000327814'], waga: 1}
  - {id: nip, typ: zawiera, pole: nip, wzorce: ['839-?571-?69-?91'], waga: 1}
  - {id: regon, typ: zawiera, pole: regon, wzorce: ['391039814'], waga: 1}
  - {id: kapital, typ: rowne, pole: kapital_zakladowy_zl, wartosc: 250000, waga: 1}
  - {id: dwoch_czlonkow, typ: zawiera, pole: kto_podpisuje, wzorce: ['dw[óo]ch\s+członk', '(dwaj|obaj|obu)\s+członk', 'współdział', 'łączn', 'wierzbick[^.]{0,80}\blis\b', '\blis\b[^.]{0,80}wierzbick'], waga: 3, krytyczne: true}
  - {id: imiennie, typ: zawiera, pole: kto_podpisuje, wszystkie: true, wzorce: ['wierzbick', '\blis\b'], waga: 1}
  - {id: prog, typ: zawiera, pole: [kto_podpisuje, podstawa], wzorce: ['50[ .]?000'], waga: 1}
  - {id: zrodlo, typ: cytuje, dokumenty: [KRS-ODPIS, UMOWA-SPOLKI, INSTR-OBIEG], tryb: dowolny, waga: 1}

polecenie: >
  Załóżmy, że 16.10.2026 uznamy reklamację Liftovii R/2026/017. Do kiedy najpóźniej musimy wymienić osłony
  albo usunąć wady według umowy, ile wyniesie kara za każdy dzień zwłoki i jaki jest jej limit? Czy musimy
  zapłacić zgłoszone przez klienta 9 800 zł za demontaż i ponowny montaż? Czy uznanie wymaga czyjejś akceptacji?

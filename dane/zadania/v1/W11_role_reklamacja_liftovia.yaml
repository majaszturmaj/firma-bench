  - {id: email, typ: zawiera, pole: zglaszajacy, wzorce: ['m\.szymanska@liftovia\.pl'], waga: 1}
  - {id: mazur, typ: zawiera, pole: stanowisko_merytoryczne, wzorce: ['mazur', 'pełnomocnik\w* ds\.? jakości'], waga: 2, krytyczne: true}

dokumenty_kluczowe: [EML-K02-01, PROC-PR07-W2, NOT-ZARZAD-2026-10-12]
polecenie: >
  Kto po stronie Liftovii zgłosił reklamację R/2026/017 i do kogo kierujemy odpowiedź? Kto u nas przygotowuje
  stanowisko merytoryczne, a kto prowadzi komunikację z klientem?
format_odpowiedzi:
  zglaszajacy: "imię, nazwisko, stanowisko i e-mail osoby zgłaszającej"
  stanowisko_merytoryczne: "kto u nas przygotowuje stanowisko"
  komunikacja_z_klientem: "kto u nas prowadzi komunikację z klientem"
  zrodla: "lista nazw plików, na których oparto odpowiedź"
sprawdzenia:

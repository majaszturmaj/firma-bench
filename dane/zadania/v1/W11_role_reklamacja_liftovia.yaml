  - {id: zrodlo, typ: cytuje, dokumenty: [PROC-PR07-W2, NOT-ZARZAD-2026-10-12], tryb: dowolny, waga: 1}
wzorcowa:
  zglaszajacy: "Marta Szymańska, Inżynier Jakości Dostaw Liftovia, m.szymanska@liftovia.pl"

polecenie: >
  DCWP w wezwaniu z 10.09.2026 r. powołuje się na § 9 ust. 3 umowy o dofinansowanie „w brzmieniu aneksu
  nr 2/2025”. Czego dotyczy ten aneks? Wymień aneksy do umowy, które mamy w dokumentach.
